# RITA demo — Apache wiring.
#
# Add the block below INSIDE the existing <VirtualHost *:443> for lme245.cs.fau.de
# (the openwebui-ssl vhost). It does NOT touch the other apps (Open WebUI, Overleaf,
# AIMorningNews) — it only adds the /rita/ path. Requires modules already enabled on
# the box: proxy, proxy_http, headers, ssl.
#
# The static page AND the API are both served by the local FastAPI app on 127.0.0.1:8090,
# so everything is same-origin under https://lme245.cs.fau.de/rita/ and port 8090 is
# never exposed directly.

    # send /rita (no slash) to /rita/
    RedirectMatch ^/rita$ /rita/

    <Location "/rita/">
        # Hard cap the request body at the edge (defence-in-depth with the app's own cap).
        LimitRequestBody 65536

        # Proxy-nonce trust boundary: inject a secret header that ONLY requests arriving
        # through Apache carry. The app rejects /api/classify without it, so another local
        # user or an SSRF on this shared box cannot hit 127.0.0.1:8090 directly and forge
        # X-Forwarded-For. 'set' overwrites any client-supplied value.
        # >>> Put the SAME random value in the app's env as PROXY_SHARED_SECRET. <<<
        RequestHeader set X-Rita-Proxy "REPLACE_WITH_A_LONG_RANDOM_NONCE"
    </Location>

    ProxyPreserveHost On
    ProxyPass        /rita/  http://127.0.0.1:8090/
    ProxyPassReverse /rita/  http://127.0.0.1:8090/

    # Apache (mod_proxy_http) appends the real client IP to X-Forwarded-For; the app trusts
    # the right-most entry, which is sound because the nonce proves the request came via Apache.
